<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Chroma design system: color, type, shape and tokens">
	<defs>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#004f4f" flood-opacity=".18"/>
		</filter>
		<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6ff7f6" stop-opacity=".28"/>
			<stop offset="1" stop-color="#6ff7f6" stop-opacity="0"/>
		</linearGradient>
	</defs>
	<circle cx="790" cy="90" r="220" fill="url(#glow)"/>
	<circle cx="120" cy="660" r="150" fill="#cce8e7" opacity=".35"/>
	<g filter="url(#shadow)">
		<rect x="70" y="40" width="760" height="620" rx="48" fill="#f8fcfb" stroke="#cfe0de" stroke-width="2"/>
	</g>
	<!-- mark + wordmark -->
	<g transform="translate(112 78)">
		<rect width="48" height="48" rx="14" fill="#006a6a"/>
		<circle cx="24" cy="24" r="12" fill="none" stroke="#cce8e7" stroke-width="3"/>
		<path d="M24 12a12 12 0 0 1 12 12" fill="none" stroke="#9cf2ef" stroke-width="3" stroke-linecap="round"/>
		<circle cx="24" cy="24" r="5" fill="#e6f4f3"/>
	</g>
	<text x="178" y="114" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#17201f">Chroma</text>
	<rect x="622" y="80" width="166" height="42" rx="21" fill="#e6f4f3"/>
	<text x="650" y="107" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#006a6a">MATERIAL 3</text>
	<line x1="112" y1="158" x2="788" y2="158" stroke="#dce9e7" stroke-width="2"/>

	<!-- color -->
	<text x="112" y="204" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#006a6a">COLOR</text>
	<g>
		<rect x="112" y="228" width="76" height="150" rx="24" fill="#006a6a"/>
		<rect x="200" y="228" width="76" height="150" rx="24" fill="#4a6361"/>
		<rect x="288" y="228" width="76" height="150" rx="24" fill="#8de3e0"/>
		<rect x="376" y="228" width="76" height="150" rx="24" fill="#cce8e7"/>
		<rect x="464" y="228" width="76" height="150" rx="24" fill="#eaf1f0" stroke="#d4e3e1" stroke-width="2"/>
	</g>
	<g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#75827f">
		<text x="112" y="404">primary</text>
		<text x="200" y="404">secondary</text>
		<text x="288" y="404">primary 80</text>
		<text x="376" y="404">surface</text>
		<text x="464" y="404">container</text>
	</g>

	<!-- type -->
	<text x="608" y="204" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#006a6a">TYPE</text>
	<text x="606" y="318" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="112" font-weight="300" letter-spacing="-6" fill="#17201f">Aa</text>
	<rect x="608" y="340" width="150" height="12" rx="6" fill="#17201f" opacity=".82"/>
	<rect x="608" y="364" width="150" height="10" rx="5" fill="#4b5a58" opacity=".45"/>
	<rect x="608" y="386" width="108" height="10" rx="5" fill="#4b5a58" opacity=".28"/>

	<!-- shape -->
	<text x="112" y="472" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#006a6a">SHAPE</text>
	<rect x="112" y="496" width="92" height="62" rx="10" fill="#006a6a" opacity=".92"/>
	<rect x="220" y="496" width="92" height="62" rx="22" fill="#4a6361" opacity=".82"/>
	<rect x="328" y="496" width="92" height="62" rx="31" fill="#8de3e0"/>
	<circle cx="544" cy="527" r="31" fill="#cce8e7"/>
	<circle cx="544" cy="527" r="14" fill="#006a6a"/>

	<!-- tokens -->
	<g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#006a6a">
		<rect x="112" y="592" width="206" height="36" rx="18" fill="#e6f4f3"/>
		<text x="128" y="615">--md-sys-color-primary</text>
		<rect x="330" y="592" width="194" height="36" rx="18" fill="#e6f4f3"/>
		<text x="346" y="615">--md-sys-typescale</text>
		<rect x="536" y="592" width="228" height="36" rx="18" fill="#e6f4f3"/>
		<text x="552" y="615">--md-sys-shape-corner</text>
	</g>

	<!-- seed note -->
	<g filter="url(#shadow)">
		<rect x="620" y="424" width="168" height="122" rx="26" fill="#ffffff" stroke="#d4e3e1" stroke-width="2"/>
	</g>
	<text x="644" y="458" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#75827f">SEED</text>
	<text x="644" y="490" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#006a6a">#006A6A</text>
	<g fill="#006a6a">
		<circle cx="650" cy="518" r="7"/><circle cx="672" cy="518" r="7" fill="#0061a4"/><circle cx="694" cy="518" r="7" fill="#386a20"/><circle cx="716" cy="518" r="7" fill="#6750a4"/>
	</g>
</svg>
